services:
  - type: web
    name: wave-blog
    runtime: node
    buildCommand: npm ci --include=dev && npm run build:admin
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
